<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<title>UUU Task Tracker</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="উদ্ভাস-উন্মেষ ERP টিমের টাস্ক ট্র্যাকার">
<meta property="og:title" content="UUU Task Tracker">
<meta property="og:description" content="উদ্ভাস-উন্মেষ ERP টিমের টাস্ক ট্র্যাকার — টাস্ক দেখা, যোগ ও আপডেট">
<meta property="og:url" content="https://onikcreation.com/tasks/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#4338CA; --brand-2:#6366F1; --brand-ink:#ffffff; --brand-soft:#EEF0FF; --brand-text:#3730A3;
  --brand-g1:#3B2FC0; --brand-g2:#5B54E6; --brand-strong:#3730A3;
  --bg:#F4F5FA; --surface:#ffffff; --surface-2:#F8F9FC; --surface-3:#F1F3F8; --line:#E6E8F0; --line-2:#D5D9E4;
  --ink:#141625; --ink-2:#4A5065; --ink-3:#80869A;
  --red:#D92D20; --red-bg:#FEF0EF; --orange:#C4560C; --orange-bg:#FFF3E8;
  --amber:#946200; --amber-bg:#FEF7DC; --blue:#1D5FC4; --blue-bg:#EAF2FE;
  --green:#18794E; --green-bg:#E7F6EE; --violet:#5B45C4; --violet-bg:#F0ECFD;
  --gray:#5D6477; --gray-bg:#EEF0F4;
  --stripe-Urgent:#EF4444; --stripe-Top:#F97316; --stripe-Medium:#EAB308; --stripe-Regular:#3B82F6; --stripe-none:#CBD0DC;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --mark:#FFF0A0;
  --sh-1:0 1px 2px rgba(20,22,37,.05);
  --sh-2:0 1px 2px rgba(20,22,37,.04),0 4px 12px rgba(20,22,37,.06);
  --sh-3:0 12px 40px rgba(20,22,37,.18);
  --r-sm:8px; --r:12px; --r-lg:16px;
  --font:"Inter","Noto Sans Bengali","Hind Siliguri","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#6D66F0; --brand-2:#8B85FF; --brand-soft:#24234A; --brand-text:#C7C3FF;
    --bg:#0F1016; --surface:#181A23; --surface-2:#1E2130; --surface-3:#242838; --line:#2A2E3E; --line-2:#363B4E;
    --ink:#ECEEF5; --ink-2:#B6BBCB; --ink-3:#848A9E;
    --red:#FF8B80; --red-bg:#3A1D1D; --orange:#FFB070; --orange-bg:#3A2817;
    --amber:#F2CD5C; --amber-bg:#342C12; --blue:#8DB8F7; --blue-bg:#192A44;
    --green:#7BD8A2; --green-bg:#142F21; --violet:#B6A9F7; --violet-bg:#28224A;
    --gray:#B0B6C6; --gray-bg:#272B39; --stripe-none:#3E4457;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --mark:#5C4E0E; --sh-1:none; --sh-2:0 1px 2px rgba(0,0,0,.35); --sh-3:0 12px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#6D66F0; --brand-2:#8B85FF; --brand-soft:#24234A; --brand-text:#C7C3FF;
  --bg:#0F1016; --surface:#181A23; --surface-2:#1E2130; --surface-3:#242838; --line:#2A2E3E; --line-2:#363B4E;
  --ink:#ECEEF5; --ink-2:#B6BBCB; --ink-3:#848A9E;
  --red:#FF8B80; --red-bg:#3A1D1D; --orange:#FFB070; --orange-bg:#3A2817;
  --amber:#F2CD5C; --amber-bg:#342C12; --blue:#8DB8F7; --blue-bg:#192A44;
  --green:#7BD8A2; --green-bg:#142F21; --violet:#B6A9F7; --violet-bg:#28224A;
  --gray:#B0B6C6; --gray-bg:#272B39; --stripe-none:#3E4457;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --mark:#5C4E0E; --sh-1:none; --sh-2:0 1px 2px rgba(0,0,0,.35); --sh-3:0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.hidden{display:none!important}
.ico{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.2px}

/* ================= টপবার ================= */
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(100deg,var(--brand-g1) 0%,var(--brand-strong) 45%,var(--brand-g2) 100%);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 10px color-mix(in srgb,var(--brand-strong) 30%,transparent)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px;letter-spacing:-.2px;white-space:nowrap;min-width:222px;flex:0 0 auto}
.logo-mark{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
.logo small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:0;margin-top:-2px}
.demo-badge{font-size:10.5px;font-weight:800;background:#FCD34D;color:#3B2A00;border-radius:999px;padding:2px 8px;letter-spacing:.3px;text-transform:uppercase}
.gsearch{flex:1;min-width:0;max-width:none;position:relative;margin:0 6px}
.gsearch input{width:100%;height:44px;border-radius:12px;font-size:15px!important;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.13);color:#fff;padding:0 70px 0 40px;outline:none;font-size:14.5px;transition:.15s}
.gsearch input::placeholder{color:rgba(255,255,255,.72)}
.gsearch input:focus{background:#fff;color:#141625;caret-color:#141625;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.gsearch input:focus::placeholder{color:#9aa0b2}
.gsearch .ico{position:absolute;left:14px;top:13px;color:rgba(255,255,255,.8);pointer-events:none}
.gsearch input:focus ~ .ico{color:#80869A}
.gsearch kbd{position:absolute;right:12px;top:11px;font-family:var(--font);font-size:11.5px;background:rgba(255,255,255,.16);border-radius:6px;padding:1px 7px;color:rgba(255,255,255,.85)}
.gsearch .s-clear{position:absolute;right:9px;top:9px;width:26px;height:26px;border:0;border-radius:50%;background:#fff;color:var(--brand-strong);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .12s,background .12s}
.gsearch .s-clear .ico{width:15px;height:15px;stroke-width:2.8;position:static;color:inherit}
.gsearch .s-clear:hover{transform:scale(1.08)}
.gsearch input:focus ~ .s-clear{background:#5A6075;color:#fff;box-shadow:none}
.gsearch .s-clear:focus-visible{outline:2px solid #fff;outline-offset:2px}
.topbar .spacer{flex:1;display:none}
.lang-btn{display:flex;align-items:center;gap:6px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:13px;padding:0 11px;white-space:nowrap}
.lang-btn:hover{background:rgba(255,255,255,.22)}
.lang-btn .ico{width:16px;height:16px}
.btn-new{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FDE047 0%,#FACC15 100%);color:#3B2A00;border:0;border-radius:12px;height:44px;padding:0 18px 0 8px;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 0 0 3px rgba(253,224,71,.28),0 4px 14px rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s}
.btn-new .ico{width:28px;height:28px;padding:5px;border-radius:9px;background:#3B2A00;color:#FDE047;stroke-width:2.6}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 0 0 4px rgba(253,224,71,.4),0 6px 18px rgba(0,0,0,.26)}
.btn-new:focus-visible{outline:3px solid #fff;outline-offset:2px}
.user-chip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:3px 12px 3px 3px;height:40px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
.user-chip .avatar{background:#fff;color:var(--brand-strong)}
.user-chip .uinfo{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.user-chip .uinfo b{font-size:13.5px}
.user-chip .uinfo small{opacity:.78;font-size:11px}
.user-menu{position:fixed;right:14px;top:64px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);padding:8px;width:280px;z-index:80}
.user-menu h4{margin:6px 10px 6px;font-size:11.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.user-menu button{display:flex;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;gap:10px;align-items:center}
.user-menu button:hover{background:var(--surface-2)}
.user-menu button.on{background:var(--brand-soft)}
.user-menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ================= লেআউট ================= */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface)}
.side h6{margin:14px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
.side h6:first-child{margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:8px 10px;color:var(--ink-2);font-weight:600;font-size:14px;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-text)}
.nav-item .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.nav-item .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-item .mail-n{color:#fff;background:#E5484D;border-radius:999px;padding:0 7px;line-height:19px;min-width:19px;text-align:center}
.bn-mail{position:absolute;top:4px;left:calc(50% + 5px);font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#E5484D;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.nav-item.active .n{color:var(--brand-text)}
.side-card{margin:18px 4px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.side-card b{color:var(--ink)}
.side-card button{margin-top:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
main{min-width:0;padding:22px 26px 100px;width:100%}

.demo-strip{display:none}

/* ================= পেইজ হেডার ও টুলবার ================= */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.ph h1 .cnt{font-size:13px;font-weight:700;background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:2px 10px}
.ph p{margin:2px 0 0;color:var(--ink-3);font-size:13.5px}
.ph .grow{flex:1;min-width:200px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tbtn{height:36px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:0 12px;font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;color:var(--ink-2);box-shadow:var(--sh-1)}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tbtn .badge-n{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700;line-height:17px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;height:36px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:0 30px 0 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--sh-1)}
.sel .ico{position:absolute;right:9px;top:10px;pointer-events:none;color:var(--ink-3)}
.msearch{display:none}
.tabs{display:none}
/* এন্ট্রির সময়ের চিপ সারি: সব / আজ / গতকাল / ৭ দিন / ৩০ দিন */
.period{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-right:6px}
/* মাঝারি ডেস্কটপে চিপ এক লাইনে, নিচে Filter/সাজানো/Group By/Excel — যাতে কোনো বোতাম একা নিচে না নামে */
@media (min-width:900px) and (max-width:1879px){.toolbar .period{flex-basis:100%;justify-content:flex-end;margin-right:0}}
.pchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:0 13px;height:36px;white-space:nowrap;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
.pchip small{font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pchip:hover{border-color:var(--brand);color:var(--ink)}
.pchip.zero{opacity:.55}
.pchip.on{background:var(--brand);border-color:var(--brand);color:#fff;opacity:1}
.pchip.on small{color:rgba(255,255,255,.85)}
.pchip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:899px){.period{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex-basis:100%;margin:0 0 2px}.pchip{flex-direction:row;justify-content:center;gap:6px;height:38px;padding:0 4px;font-size:12.5px;border-radius:12px;min-width:0}.pchip small{font-size:11.5px}}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
/* তালিকার শুরুতে খাড়া চিহ্ন (ডেস্কটপ): চিহ্ন + কার্ড পাশাপাশি, তাই চিহ্নওয়ালা কার্ড ডানে সরে */
.mk-wrap{display:flex;align-items:center;gap:8px}
.mk-wrap>.row{flex:1 1 auto;min-width:0}
.mk-side{display:flex;gap:4px;flex:0 0 auto;align-self:center}
.mk-pill{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:5px;padding:10px 4px;border-radius:9px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.2px;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 32%,var(--line))}
.mk-pill i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:0 0 auto}
@media (max-width:899px){.mk-wrap{display:block}.mk-side{display:none}}
.mk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mk-chips button,.mk-chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.mk-chips button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.mk-chips i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.mk-chips label input{margin:0;accent-color:var(--brand)}
.mk-sub{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;margin-top:10px}
/* ভাগ করে দেখা: html[data-gstyle] = line (শিরোনাম-রেখা, A) / panel (আলাদা প্যানেল, B) */
.grp{display:flex;flex-direction:column;gap:8px}
.gbody{display:flex;flex-direction:column;gap:8px}
.gh{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:none;border:0;padding:0}
.gh .cv{width:18px;height:18px;display:grid;place-items:center;color:var(--ink-3);transition:transform .15s}
.gh .cv .ico{width:15px;height:15px}
.grp.closed .gh .cv{transform:rotate(-90deg)}
.gh .gdot{width:10px;height:10px;border-radius:50%;background:var(--g);flex:0 0 auto}
.gh b{font-size:14.5px;font-weight:700}
.gh .gn{font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface-3);border-radius:999px;padding:1px 8px}
.gh .gmini{margin-left:auto;font-size:12px;color:var(--ink-3)}
.gh:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
html:not([data-gstyle="panel"]) .gh{padding:12px 4px 6px;border-bottom:1px solid var(--line)}
html:not([data-gstyle="panel"]) .grp + .grp{margin-top:4px}
html[data-gstyle="panel"] .grp{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--g);border-radius:var(--r);padding:10px 10px 10px 12px}
html[data-gstyle="panel"] .grp + .grp{margin-top:6px}
@media (max-width:899px){.gh .gmini{display:none}.toolbar .period{order:-2}.toolbar .sel.gsel{flex:1 1 0;order:-1;min-width:0}.toolbar .sel.gsel select{width:100%}}
/* থিম প্যানেলের ছোট প্রিভিউ */
.gp-prev{display:flex;flex-direction:column;gap:3px;padding:6px;border-radius:9px;background:var(--bg);border:1px solid var(--line);min-height:62px}
.gp-prev>i{display:block;height:9px;border-radius:3px;background:var(--surface);border:1px solid var(--line)}
.gp-prev>i.h{height:5px;border:0;border-radius:3px;background:var(--ink-3);opacity:.55;width:45%;margin-top:2px}
.gp-prev[data-g="line"]>i.h{box-shadow:0 3px 0 -2px var(--line)}
.gp-prev[data-g="panel"]>span{display:flex;flex-direction:column;gap:3px;padding:3px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--g)}
.gp-prev[data-g="panel"]>span>i{display:block;height:7px;border-radius:3px;background:var(--surface);border:1px solid var(--line)}
.gp-prev[data-g="panel"]>span>i.h{height:4px;border:0;background:var(--ink-3);opacity:.55;width:45%}
.gp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:420px}
.legend .day-sum{margin-left:auto;color:var(--ink-2);font-size:12.5px}
.legend .day-sum b{color:var(--ink)}
@media (max-width:899px){.legend .day-sum{margin-left:0;flex-basis:100%}}
.tip small{display:block;margin-top:4px;opacity:.75;font-size:11px}
.afchip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand-text);border:0;border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;font-weight:600}
.afchip i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 15%,transparent);font-size:11px}
.afchip.clear{background:none;color:var(--ink-3);text-decoration:underline;padding-left:4px}

/* ================= টাস্ক তালিকা ================= */
/* প্রতিটা টাস্ক আলাদা কার্ড, মাঝে ৮px ফাঁকা */
.list{display:flex;flex-direction:column;gap:8px}
.list .empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2)}
.list-head,.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 118px 124px 150px 96px 104px;gap:0 16px;align-items:center;padding:14px 18px 14px 20px}
.list-head{position:sticky;top:60px;z-index:5;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;padding-top:9px;padding-bottom:9px}
.row{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);cursor:pointer;transition:background .12s,border-color .12s}
.row:last-child{border-radius:var(--r)}
.row:hover{background:var(--surface-2);border-color:var(--line-2)}
.row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
/* সেভ/আপডেটের পর তালিকায় সেই সারি এক মুহূর্ত জ্বলে ওঠে */
@keyframes rowFlash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 60%,transparent)}25%{box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 40%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.row.flash{animation:rowFlash 1.8s ease-out;border-color:var(--brand)!important}
@media (prefers-reduced-motion:reduce){.row.flash{animation:none;outline:2px solid var(--brand)}}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--stripe,var(--stripe-none))}
.row>*{min-width:0}
.t-main{display:flex;flex-direction:column;gap:4px}
.t-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.t-no{font-family:var(--mono);font-weight:700;color:var(--ink-2);font-size:12px}
.t-title{font-weight:600;color:var(--ink);font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.t-sub{display:flex;flex-direction:column;align-items:stretch;gap:5px;min-width:0}
.t-snip{color:var(--ink-3);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;overflow-wrap:anywhere;min-width:0}
.menu-chip{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;max-width:100%;align-self:flex-start;min-width:0;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-chip .ico{width:12px;height:12px;color:var(--ink-3)}
.c-pf{font-size:13px;color:var(--ink-2);line-height:1.35}
.c-pf small{display:block;color:var(--ink-3);font-size:12px}
.c-iss{font-size:13px;color:var(--ink-2);line-height:1.35}
.c-iss>span,.c-iss small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-iss small{color:var(--ink-3);font-size:12px}
.c-ent{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.c-ent .avatar{width:24px;height:24px;font-size:11px}
.c-date{font-size:13px;color:var(--ink-2);white-space:nowrap}
.c-date small{display:block;color:var(--ink-3);font-size:11.5px}
.c-iss .c-appr{display:block;color:#059669;font-weight:700;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.vtag.appr{border-style:dashed}
.c-date .c-time{color:var(--ink-2);font-size:12px;font-weight:600;margin-top:1px}
.m-only{display:none}
/* মোবাইলের ঘন তালিকার সারি (ডিজাইন C) — ডেস্কটপে লুকানো */
.m-row{display:none;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.mr-det{grid-column:1 / -1;margin-top:4px;font-size:13px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;overflow-wrap:anywhere}
.m-row>.cdot{margin-top:7px}
.mr-main{min-width:0}
.mr-title{font-size:14.5px;font-weight:600;line-height:1.45;color:var(--ink);word-break:break-word;overflow-wrap:anywhere}
.mr-sub{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;min-width:0}
.mr-sub>span{overflow:hidden;text-overflow:ellipsis}
.mr-sub .ico{width:12px;height:12px}
.mr-dup{color:var(--red);font-weight:700}
.mr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.dup-flag{display:inline-flex;align-items:center;gap:3px;color:var(--red);font-weight:700;font-size:11.5px;background:var(--red-bg);border-radius:5px;padding:0 6px}
.empty{padding:56px 16px;text-align:center;color:var(--ink-3)}
.empty .big{width:56px;height:56px;border-radius:16px;background:var(--surface-3);display:grid;place-items:center;margin:0 auto 12px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.more{display:flex;align-items:center;gap:6px;margin:16px auto 0;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 18px;color:var(--ink-2);font-weight:600;box-shadow:var(--sh-1)}

/* ================= ব্যাজ ================= */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px 2px 8px;white-space:nowrap;line-height:1.55}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
/* সেটিংস থেকে আসা রঙ: --c দিয়ে হালকা ব্যাকগ্রাউন্ড + গাঢ় লেখা */
.badge.dyn{background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.p-Urgent{background:var(--red-bg);color:var(--red)}
.p-Top{background:var(--orange-bg);color:var(--orange)}
.p-Medium{background:var(--amber-bg);color:var(--amber)}
.p-Regular{background:var(--blue-bg);color:var(--blue)}
.p-Low,.p-none{background:var(--gray-bg);color:var(--gray)}
.p-none::before{display:none}
.s-Pending{background:var(--amber-bg);color:var(--amber)}
.s-TaskAdded{background:var(--blue-bg);color:var(--blue)}
.s-Backlog{background:var(--violet-bg);color:var(--violet)}
.s-Done{background:var(--green-bg);color:var(--green)}
.s-Canceled{background:var(--gray-bg);color:var(--gray)}
.dot-Pending{background:#EAB308}.dot-TaskAdded{background:#3B82F6}.dot-Backlog{background:#8B5CF6}.dot-Done{background:#22C55E}.dot-Canceled{background:#9CA3AF}.dot-Urgent{background:#EF4444}.dot-open{background:var(--brand)}.dot-all{background:var(--ink-3)}

/* ================= ড্রয়ার ================= */
.overlay{position:fixed;inset:0;background:rgba(12,14,26,.42);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
/* টাস্ক ডিটেইল: ডেস্কটপে মাঝখানে পপআপ, মোবাইলে পুরো স্ক্রিন */
.drawer{position:fixed;left:50%;top:50%;width:min(1040px,94vw);height:min(86vh,900px);background:var(--surface);z-index:60;border-radius:18px;
  transform:translate(-50%,-47%) scale(.97);opacity:0;pointer-events:none;transition:opacity .18s,transform .2s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-3);overflow:hidden}
.drawer.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.d-side{position:sticky;top:0;display:flex;flex-direction:column;gap:16px}
.d-side .fields{grid-template-columns:1fr}
.d-side .field:nth-child(odd){border-right:0}
.d-side .field:last-child{border-bottom:0}
.d-nav{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12.5px}
.d-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top))}
.d-head .grow{flex:1;min-width:0}
.d-head h3{margin:0;font-size:15px;font-weight:700}
.d-head small{color:var(--ink-3);font-size:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.d-body{flex:1;overflow:auto;padding:20px 22px 28px}
.d-title{font-size:19px;font-weight:700;line-height:1.45;margin:0 0 10px;letter-spacing:-.2px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.d-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.d-foot{border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 14px;font-weight:600;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn.primary:hover{filter:brightness(.93)}
.sec{margin-top:20px}
.sec-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-3);margin:0 0 8px;letter-spacing:.4px;text-transform:uppercase}
.status-seg{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:4px;background:var(--surface-3);border-radius:11px;padding:4px}
.status-seg button{border:0;background:none;border-radius:8px;padding:7px 4px;font-size:12.5px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.status-seg button .dot{width:7px;height:7px;border-radius:50%}
.status-seg button:hover:not(:disabled){color:var(--ink)}
.status-seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-2)}
.status-seg button:disabled{cursor:default}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.field{padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.field:nth-child(odd){border-right:1px solid var(--line)}
.field small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600}
.field div{font-size:14px;word-break:break-word;color:var(--ink)}
.field div.muted{color:var(--ink-3)}
.details-box{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.75}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a:hover{text-decoration:underline}
.warn-box{display:flex;gap:10px;background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;line-height:1.55}
.warn-box button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:0 2px}
.history{list-style:none;margin:0;padding:0}
.history li{position:relative;padding:0 0 14px 26px;font-size:13.5px}
.history li::before{content:"";position:absolute;left:6px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.history li::after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:1px;background:var(--line-2)}
.history li:last-child::after{display:none}
.history small{color:var(--ink-3);display:block;font-size:12px}

/* ================= ফর্ম ================= */
.modal{position:fixed;z-index:70;background:var(--surface);display:flex;flex-direction:column;inset:0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.modal.on{transform:none}
@media (min-width:760px){
  .modal{inset:auto;left:50%;top:50%;width:min(800px,94vw);max-height:90vh;border-radius:18px;transform:translate(-50%,-47%) scale(.98);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--sh-3)}
  .modal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}
.form-sec{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 10px;grid-column:1/-1;display:flex;align-items:center;gap:8px}
.form-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fg label .req{color:var(--red)}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14.5px;outline:none;transition:border-color .12s,box-shadow .12s}
.fg select{height:41px}
.fg textarea{min-height:130px;resize:vertical;line-height:1.6}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fg .invalid{border-color:#e53935!important;box-shadow:0 0 0 1px #e53935;transition:none}
.fg .dupwarn{font-size:12.5px;color:var(--orange);margin-top:5px}
.auto-info{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--brand-text);border-radius:12px;padding:10px 14px;font-size:13px}
.seg-pick{display:flex;flex-wrap:wrap;gap:6px}
.seg-pick label{margin:0}
.seg-pick input{position:absolute;opacity:0;width:1px;height:1px}
.seg-pick .pdot{display:inline-block;width:7px;height:7px;border-radius:50%}
.fg .seg-pick.invalid{border:0!important;box-shadow:none!important}
.seg-pick>label>span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.seg-pick input:checked + span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.seg-pick input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
.seg-pick.invalid>label>span{border-color:#e53935;box-shadow:0 0 0 1px #e53935}

/* ================= ফিল্টার শিট ================= */
.fsheet{position:fixed;z-index:65;background:var(--surface);left:0;right:0;bottom:0;max-height:88vh;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-3)}
.fsheet.on{transform:none}
@media (min-width:900px){.fsheet{left:auto;top:0;width:420px;max-height:none;border-radius:0;transform:translateX(100%)}.fsheet.on{transform:none}}
.fgroup{margin-bottom:18px}
.fgroup h5{margin:0 0 8px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.fopts{display:flex;flex-wrap:wrap;gap:6px}
.fopt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fopt small{font-weight:600;color:var(--ink-3);font-size:11.5px}
.fopt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fopt.on small{color:rgba(255,255,255,.8)}
.fdates{display:flex;gap:8px}
.fdates input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:10px;padding:8px;background:var(--surface)}

/* ================= ড্যাশবোর্ড ================= */
/* KPI: ডেস্কটপে সব (বিশেষ ভিউসহ) এক লাইনের স্ট্রিপে, উপরে রঙিন দাগ; মোবাইলে ৩ কলামের ছোট বক্স (নিচে মোবাইল অংশে) */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);margin-bottom:16px;overflow:hidden}
.kpi{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;align-content:start;min-width:0;background:none;border:0;border-left:1px solid var(--line);padding:16px 16px 14px;text-align:left;cursor:pointer;position:relative;transition:background .12s}
.kpi:first-child{border-left:0}
.kpi::before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.kpi:hover{background:var(--surface-2)}
.kpi:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.kpi .k-ico{display:flex;align-items:center;background:none!important;color:var(--c)!important}
.kpi .k-ico .ico{width:15px;height:15px}
.kpi small{color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.kpi b{grid-column:1/-1;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi > span:not(.k-ico){grid-column:1/-1;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-1{--c:var(--brand)} .k-2{--c:var(--red)} .k-3{--c:var(--violet)} .k-4{--c:var(--green)}
@media (min-width:900px) and (max-width:1199px){.kpi{padding:14px 12px 12px}.kpi::before{left:12px;right:12px}.kpi b{font-size:24px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-2);min-width:0}
.card h4{margin:0 0 2px;font-size:15px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
.hbar{display:grid;grid-template-columns:minmax(90px,130px) 1fr 40px;gap:10px;align-items:center;width:100%;background:none;border:0;padding:6px 6px;border-radius:8px;text-align:left;color:var(--ink-2);font-size:13.5px}
.hbar:hover{background:var(--surface-2)}
.hbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{height:10px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .fill{height:100%;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px;display:block}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:var(--sh-3);white-space:nowrap;z-index:5}
.tip b{display:block;margin-bottom:3px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.linkbtn{background:none;border:0;color:var(--blue);padding:0;font-size:13px;font-weight:600}
.linkbtn:hover{text-decoration:underline}
.mini-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}

.tr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tr-meta{font-size:12.5px;color:var(--ink-3)}
.tr-act{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:899px){.trash-row{flex-direction:column;align-items:stretch}.tr-act .btn{flex:1;justify-content:center}}

/* লোগো = হোম */
.logo{cursor:pointer;border-radius:10px}
.logo:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* বিশেষ ভিউ (Our Task, Liton Vai ...) */
.vtag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 6px;line-height:17px;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.mr-sub .vtag{flex:0 0 auto}
.vscope{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:3px;margin-top:8px}
.vscope button{border:0;background:none;border-radius:7px;padding:4px 14px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.vscope button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.vkpis{margin-top:-4px}
.view-card{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.vc-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vc-head .opt-name{flex:1;min-width:140px;font-size:15px}
.vc-count{font-size:12.5px;color:var(--ink-3)}
.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.vc-grid h5{margin:0 0 6px;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.vc-grid .hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.vc-person{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;background:var(--surface);color:var(--ink)}
@media (max-width:899px){.vc-grid{grid-template-columns:1fr}.vscope{margin-top:0}}

/* পুরনো টাস্ক ইমপোর্ট */
.imp-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.imp-step{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.imp-step h5{margin:0;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.imp-step h5 b{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-size:12px}
.imp-step .hint{font-size:12.5px;color:var(--ink-3)}
.imp-stats{display:flex;flex-wrap:wrap;gap:8px}
.imp-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink-2)}
.imp-stat b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.imp-stat.good b{color:var(--green)}
.imp-bar{height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.imp-bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.imp-list{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.imp-list li{margin-bottom:3px;word-break:break-word}
.imp-batch{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}
.imp-file{font-size:14px}

.btn[disabled]{opacity:.6;cursor:wait}
.um-me{display:flex;gap:10px;align-items:center;padding:8px 10px}
.um-me b{display:block;font-size:14px}
.um-me small{color:var(--ink-3);font-size:12px;word-break:break-all}
.toast.err{background:#B42318}
@media (min-width:760px){#loginModal{width:min(440px,94vw)}}
.lg-sent{margin:0 0 14px;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.lg-code{font-size:26px!important;letter-spacing:10px;text-align:center;font-family:var(--mono)!important}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1A1D2B;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;z-index:90;opacity:0;transition:.22s;pointer-events:none;max-width:90vw;display:flex;gap:8px;align-items:center;box-shadow:var(--sh-3)}
.toast.on{opacity:1;transform:translateX(-50%)}
.bottomnav{display:none}

/* ================= মোবাইল ================= */
@media (max-width:899px){
  body{font-size:15px}
  .topbar{height:56px;padding:0 14px;gap:10px}
  .logo{width:auto;font-size:16px}
  .logo small,.gsearch,.btn-new,.user-chip .uinfo{display:none}
  .logo{min-width:0;flex:0 1 auto;overflow:hidden}
  .logo>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis}
  .lang-btn,.user-chip{flex:0 0 auto}
  .topbar .spacer{display:block;flex:1}
  .lang-btn{height:34px;padding:0 9px}
  .gen-grid{grid-template-columns:1fr;padding:14px}
  .perm-table th,.perm-table td{padding:10px 8px}
  .user-chip{padding:3px;height:auto;border:0;background:none}
  .user-menu{top:58px}
  .shell{display:block}
  .side{display:none}
  main{padding:14px 14px 110px}
  .demo-strip{display:flex;gap:8px;align-items:center;background:var(--amber-bg);color:var(--amber);font-size:12.5px;padding:7px 14px;border-bottom:1px solid var(--line)}
  .demo-strip span{flex:1}
  .demo-strip button{background:none;border:0;color:inherit;font-size:16px;padding:0 2px}
  .ph{margin-bottom:10px;align-items:center}
  .ph h1{font-size:19px}
  .ph p{display:none}
  .toolbar{width:100%}
  .toolbar .sel{flex:1 1 0;min-width:0}
  .toolbar #btnFilter{display:none!important}
  .toolbar #btnCsv{display:none!important}
  .toolbar .sel select{width:100%}
  .msearch{display:block;position:relative;margin-bottom:10px}
  .msearch input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 44px 0 42px;font-size:16px;outline:none;box-shadow:var(--sh-2)}
  .msearch input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .msearch .ico{position:absolute;left:13px;top:14px;color:var(--ink-3)}
  .msearch .s-clear{position:absolute;right:9px;top:10px;width:26px;height:26px;border:0;border-radius:50%;background:var(--ink-2);color:var(--surface);display:grid;place-items:center}
  .msearch .s-clear .ico{width:15px;height:15px;stroke-width:2.8;position:static;color:inherit}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:0 14px 2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
  .tab .n{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .tab.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .tab.active .n{color:var(--bg);opacity:.75}

  .list{background:none;border:0;box-shadow:none;display:flex;flex-direction:column;gap:10px}
  .list-head{display:none}
  .row{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);padding:13px 14px 12px 16px}
  .row:last-child{border-bottom:1px solid var(--line);border-radius:14px}
  .row::before{top:14px;bottom:14px}
  .row .d-only{display:none}
  .m-only{display:flex}
  .t-top{justify-content:space-between}
  .t-title{-webkit-line-clamp:2;font-size:15px}
  .t-snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;overflow-wrap:anywhere}
  .t-sub{flex-direction:column;align-items:stretch;gap:6px}
  .menu-chip{max-width:100%;align-self:flex-start}
  .m-badges{gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .m-badges .pf{font-size:12px;color:var(--ink-3);font-weight:600}
  .m-foot{align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-3)}
  .m-foot .avatar{width:22px;height:22px;font-size:10.5px}
  .m-foot .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .kpis{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:none;border:0;box-shadow:none;overflow:visible}
  .kpi{display:flex;flex-direction:column-reverse;justify-content:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 12px;overflow:hidden}
  .kpi:first-child{border-left:1px solid var(--line)}
  .kpi::before{left:0;right:auto;top:10px;bottom:10px;width:3px;height:auto;border-radius:0 3px 3px 0}
  .kpi .k-ico,.kpi > span:not(.k-ico){display:none}
  .kpi b{font-size:20px;line-height:1.2;margin:0}
  .kpi small,.kpi b{align-self:stretch}
  .kpi small{font-size:11px;line-height:1.3}
  .cards{grid-template-columns:1fr}
  .drawer{left:0;top:0;width:100%;height:100%;border-radius:0;transform:translateY(100%);opacity:1}
  .drawer.on{transform:none}
  .d-grid{grid-template-columns:1fr;gap:0}
  .d-side{position:static;margin-top:20px}
  .set-wrap{grid-template-columns:1fr}
  .set-menu{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .set-menu .nav-item{flex:0 0 auto;width:auto}
  .set-menu h6{display:none}
  .opt-row,.opt-row.hasgroup{grid-template-columns:22px 30px minmax(0,1fr) auto auto;padding:9px 12px;row-gap:6px}
  .opt-row.nocolor{grid-template-columns:22px minmax(0,1fr) auto auto}
  .opt-row .opt-use,.opt-row .sw-t{display:none}
  .opt-row .opt-group{order:9;grid-column:3/-1}
  .opt-add,.set-head,.set-note{padding-left:14px;padding-right:14px}
  .user-row{grid-template-columns:32px minmax(0,1fr) auto;padding:10px 12px}
  .user-row .u-email{grid-column:2/-1;grid-row:2}
  .disc-row{grid-template-columns:minmax(0,1fr) 130px 36px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .disc-row input[name=disc_note]{grid-column:1/-1;grid-row:2}
  .qdisc{grid-template-columns:minmax(0,1fr) 130px}
  .qdisc input[id=qdNote]{grid-column:1/-1}
  .qdisc button{grid-column:1/-1;justify-content:center}
  .d-body{padding:16px 16px 24px}
  .d-title{font-size:17px}
  .status-seg{grid-template-columns:repeat(3,1fr)}
  .fields{grid-template-columns:1fr}
  .field:nth-child(odd){border-right:0}
  .form-grid{grid-template-columns:1fr}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(20,22,37,.05)}
  .bottomnav button{position:relative;background:none;border:0;padding:8px 0 7px;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
  .bottomnav button .ico{width:22px;height:22px}
  .bottomnav button.active{color:var(--brand)}
  .bottomnav .bn-add{position:relative}
  .bottomnav .bn-add span{width:50px;height:50px;border-radius:16px;margin-top:-22px;background:linear-gradient(135deg,var(--brand),var(--brand-g2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(67,56,202,.45);border:3px solid var(--surface)}
  .bottomnav .bn-add span .ico{width:24px;height:24px;stroke-width:2.5}
  /* Status: ৪ কলামের টাইল (ডিজাইন A) */
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible;margin:0 0 12px;padding:0}
  .tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);border-radius:12px;padding:8px 7px 7px;min-width:0;background:var(--surface);text-align:left;box-shadow:var(--sh-1)}
  .tab .n{order:-1;font-size:19px;font-weight:800;line-height:1.15;color:var(--ink);opacity:1;font-variant-numeric:tabular-nums}
  .tab .tl{display:flex;align-items:center;gap:4px;max-width:100%;font-size:10.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden}
  .tab .tl span:last-child{overflow:hidden;text-overflow:ellipsis}
  .tab .tl .cdot{width:6px;height:6px}
  .tab.active{background:var(--brand);border-color:var(--brand)}
  .tab.active .n{color:#fff}
  .tab.active .tl{color:rgba(255,255,255,.85)}
  .tab.active .tl .cdot{background:#fff}
  /* বিশেষ ট্যাব (Our Task, Liton Vai): দুই কলাম জুড়ে, চিকন, এক লাইনে নাম + সংখ্যা; প্রথমটা নতুন সারি থেকে */
  .tab.vtab{grid-column:span 2;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 12px}
  .tab:not(.vtab) + .tab.vtab{grid-column:1 / span 2}
  .tab.vtab .n{order:2;font-size:15px}
  .tab.vtab .tl{font-size:13px;font-weight:700;color:var(--ink-2);gap:7px}
  .tab.vtab .tl .cdot{width:8px;height:8px}
  .tab.vtab.active .tl{color:#fff}
  /* তালিকা: এক সারিতে এক টাস্ক (ডিজাইন C) */
  .list{display:flex;flex-direction:column;gap:8px;background:none;border:0;box-shadow:none}
  .row{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-1);padding:11px 12px}
  .row:last-child{border-bottom:1px solid var(--line);border-radius:12px}
  .row:active{background:var(--surface-2)}
  .row::before{display:none}
  .row>*:not(.m-row){display:none!important}
  .m-row{display:grid}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" data-home role="button" tabindex="0" data-i18n-title="home.title">
    <span class="logo-mark"><svg class="ico" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
    <span><span id="appName">Task Tracker</span><small id="appSub"></small></span>
    
  </div>
  <button class="btn-new" id="btnNewTop"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="new.task"></span></button>
  <div class="gsearch">
    <input id="q" class="qinput" type="search" data-i18n-ph="search.ph" autocomplete="off">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <kbd id="kbdHint">/</kbd>
    <button class="s-clear hidden" data-qclear data-i18n-title="clear"><svg class="ico sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <span class="spacer"></span>
  <button class="lang-btn" id="modeBtn" data-theme-toggle data-i18n-title="um.theme"></button>
  <button class="user-chip" id="userChip" aria-haspopup="true">
    <span class="avatar" id="uAvatar">O</span>
    <span class="uinfo"><b id="uName">Onik</b><small id="uRole">Admin</small></span>
  </button>
</header>
<div class="user-menu hidden" id="userMenu"></div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main>
    <div class="kt" id="kpiTop"></div>
    <section id="view-list">
      <div class="msearch">
        <input id="qm" class="qinput" type="search" data-i18n-ph="search.ph.m" autocomplete="off" enterkeyhint="search">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <button class="s-clear hidden" data-qclear data-i18n-title="clear"><svg class="ico sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="msum" id="msum"></div>
      <div class="tabs" id="tabs"></div>
      <div class="ph">
        <div class="grow"><h1><span id="listTitle"></span><span class="cnt" id="resultN">0</span></h1><p id="listDesc"></p><div class="vscope hidden" id="vscope"></div></div>
        <div class="toolbar">
          <div class="period" id="period" role="group"></div>
          <button class="mdate" id="mDate" data-mdate></button>

            <option value="old" data-i18n="sort.old"></option>
            <option value="pri" data-i18n="sort.pri"></option>
            <option value="upd" data-i18n="sort.upd"></option>
          </select><svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
          <span class="sel gsel"><select id="groupBy" data-i18n-title="grp.title">
            <option value="" data-i18n="grp.none"></option>
            <option value="type" data-i18n="grp.type"></option>
            <option value="priority" data-i18n="grp.priority"></option>
            <option value="platform" data-i18n="grp.platform"></option>
          </select><svg class="ico sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
          <button class="tbtn" id="btnCsv" data-i18n-title="csv.title"><svg class="ico sm" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Excel</button>
        </div>
      </div>
      <div class="date-bar" id="dateBar"><span class="db-lbl"><svg class="ico sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span data-i18n="dr.lbl"></span></span><input type="date" id="dbFrom" data-i18n-title="f.from"><span class="db-dash">–</span><input type="date" id="dbTo" data-i18n-title="f.to"><span class="db-res" id="dbRes"></span><button class="btn" id="dbClear" data-i18n="dr.clear"></button></div>

      <button class="more hidden" id="more"></button>

    <section id="view-dash" class="hidden"></section>
    <section id="view-report" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
    <section id="view-trash" class="hidden"></section>
    <section id="view-notes" class="hidden"></section>
  </main>
</div>

<nav class="bottomnav" id="bottomnav">
  <button data-view="list" class="active"><svg class="ico" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="nav.list"></span></button>
  <button data-view="dash"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav.dash"></span><i class="bn-mail hidden" id="bnMail"></i></button>
  <button class="bn-add" id="bnAdd" data-i18n-title="new.task"><span><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><b data-i18n="nav.new" style="font-weight:600"></b></button>
  <button data-open-theme><svg class="ico" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.9-4.5-8.6-10-8.6z"/></svg><span data-i18n="nav.theme"></span></button>
  <button data-act="filter"><svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span data-i18n="filter"></span></button>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="formModal" role="dialog"></div>
<div class="modal" id="themeModal" role="dialog"></div>
<div class="modal" id="loginModal" role="dialog"></div>
<div class="modal" id="csvModal" role="dialog" aria-modal="true"></div>
<div class="modal" id="mdateModal" role="dialog" aria-modal="true"></div>

// force = Sync বাটন: Apps Script-এর ২০ সেকেন্ডের ক্যাশ বাদ দিয়ে এখনই নতুন হিসাব

function monthData() {
  var d = new Date(), out = [];
  for (var i = 11; i >= 0; i--) {
    var m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push({key: m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0'), label: MONTHS[m.getMonth()], year: m.getFullYear(), done: 0, open: 0, other: 0});
  }
  var idx = {}; out.forEach(function (o, i) { idx[o.key] = i; });
  tasks.forEach(function (t) {
    var k = (t.createdAt || '').slice(0, 7); if (!(k in idx)) return;
    var o = out[idx[k]], g = statusGroup(t.status);
    if (g === 'done') o.done++; else if (g === 'open') o.open++; else o.other++;
  });
  // শুরুর দিকের খালি মাসগুলো বাদ (অন্তত ৪ মাস দেখাবে)
  while (out.length > 4 && !(out[0].done + out[0].open + out[0].other)) out.shift();

function dayData(off) {
  var now = new Date(), d = new Date(now.getFullYear(), now.getMonth() - (off || 0), 1);
  var y = d.getFullYear(), m = d.getMonth(), last = new Date(y, m + 1, 0).getDate(), today = off ? 0 : now.getDate(), out = [];

  }

// জমানো (stacked) কলাম চার্ট — মাস আর দিনের চার্ট একই চেহারায়
// o: {wrap, tip, aria, labelEvery(i,o,bw) → লেবেল দেখাবে কিনা, labelStyle(o), tipTitle(o), totals(bw) → মাথায় মোট, onPick(o)}
function stackChart(o) {
  var data = o.data, wrap = $(o.wrap);
  // আসল পিক্সেল প্রস্থে আঁকা, যাতে মোবাইলেও লেখা ১১px থাকে
  var W = Math.max(300, Math.round(wrap.clientWidth || 760)), H = W < 500 ? 220 : 270, L = 36, R = 8, Tp = 18, Bt = 28;
  var max = Math.max.apply(null, data.map(function (d) { return d.done + d.open + d.other; }).concat([1]));
  var step = max > 80 ? 25 : max > 40 ? 10 : max > 10 ? 5 : max > 4 ? 2 : 1, top = Math.ceil(max / step) * step;
  var pw = W - L - R, ph = H - Tp - Bt, bw = pw / data.length, barW = Math.min(40, bw * 0.6);
  var y = function (v) { return Tp + ph - v / top * ph; };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.aria) + '">';
  for (var g = 0; g <= top; g += step) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + g + '</text>';
  }
  var showTot = o.totals ? o.totals(bw) : true;
  data.forEach(function (d, i) {
    var x = L + bw * i + (bw - barW) / 2, base = 0;
    if (d.today) svg += '<rect x="' + (L + bw * i + 1) + '" y="' + Tp + '" width="' + (bw - 2) + '" height="' + ph + '" rx="4" fill="var(--brand-soft)" opacity=".55"/>';
    var segs = [['done', 'var(--series-1)'], ['open', 'var(--series-2)'], ['other', 'var(--series-3)']].filter(function (s) { return d[s[0]] > 0; });
    segs.forEach(function (s, si) {
      var v = d[s[0]], y0 = y(base), y1 = y(base + v), gap = si > 0 ? 2 : 0;
      var hh = Math.max(0, y0 - y1 - gap), yy = y1;
      if (si === segs.length - 1 && hh > 4) {
        var r = Math.min(4, barW / 2);
        svg += '<path d="M' + x + ',' + (yy + hh) + 'V' + (yy + r) + 'Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy + 'H' + (x + barW - r) + 'Q' + (x + barW) + ',' + yy + ' ' + (x + barW) + ',' + (yy + r) + 'V' + (yy + hh) + 'Z" fill="' + s[1] + '"/>';
      } else {
        svg += '<rect x="' + x + '" y="' + yy + '" width="' + barW + '" height="' + hh + '" fill="' + s[1] + '"/>';
      }
      base += v;
    });
    var tot = d.done + d.open + d.other;
    if (tot && showTot) svg += '<text x="' + (x + barW / 2) + '" y="' + (y(tot) - 5) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">' + tot + '</text>';
    if (!o.labelEvery || o.labelEvery(i, d, bw)) {
      var st = o.labelStyle ? o.labelStyle(d) : '';
      svg += '<text x="' + (L + bw * i + bw / 2) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)"' + st + '>' + d.label + '</text>';
    }
    svg += '<rect class="hit" data-i="' + i + '" x="' + (L + bw * i) + '" y="' + Tp + '" width="' + bw + '" height="' + ph + '" fill="transparent"' + (o.onPick && tot ? ' style="cursor:pointer"' : '') + '/>';
  });
  svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line-2)" stroke-width="1"/></svg>';
  wrap.innerHTML = svg + '<div class="tip hidden" id="' + o.tip + '"></div>';
  var tip = $(o.tip);
  wrap.querySelectorAll('.hit').forEach(function (r) {
    var d = data[+r.getAttribute('data-i')];
    var show = function () {
      tip.innerHTML = '<b>' + o.tipTitle(d) + ' — ' + T('ch.total') + ' ' + (d.done + d.open + d.other) + '</b>' +
        '<div><i style="background:var(--series-1)"></i>' + T('ch.done') + ': ' + d.done + '</div>' +
        '<div><i style="background:var(--series-2)"></i>' + T('ch.open.s') + ': ' + d.open + '</div>' +
        '<div><i style="background:var(--series-3)"></i>' + T('ch.other') + ': ' + d.other + '</div>' +
        (o.onPick && (d.done + d.open + d.other) ? '<small>' + T('chd.click') + '</small>' : '');
      tip.classList.remove('hidden');
      var wr = wrap.getBoundingClientRect(), rr = r.getBoundingClientRect();
      var left = rr.left - wr.left + rr.width / 2 - tip.offsetWidth / 2;
      tip.style.left = Math.max(0, Math.min(wr.width - tip.offsetWidth, left)) + 'px';
      tip.style.top = '0px';
    };
    r.addEventListener('mouseenter', show);
    r.addEventListener('click', function () { if (o.onPick && (d.done + d.open + d.other)) o.onPick(d); else show(); });
    r.addEventListener('mouseleave', function () { tip.classList.add('hidden'); });
  });
}

// প্যানেল খুললে history-তে একটা পাহারা-ধাপ (guard) যোগ হয়, ব্যাক করলে সেটা সরে আর প্যানেল বন্ধ হয়।

// আর সেটা থাকা অবস্থায় ব্যাক করলে সেটাকেই "ব্যাক" ধরা হয় (যেমন খোলা টাস্ক পপআপ বন্ধ)।
var histGuard = false, formSnap = '';

function guardedLayers() {
  return [['mdateModal', closeMDate], ['csvModal', closeCsv], ['loginModal', function () { if (typeof closeLogin === 'function') closeLogin(); }], ['themeModal', closeTheme], ['formModal', closeForm], ['fsheet', closeFilters]]

function onHistBack(state) {

    // না-সেভ করা লেখা থাকলে ফর্ম বন্ধ নয় — ভুল জেসচারে লেখা যাতে না হারায়
    if (top[0] === 'formModal' && formState() !== formSnap) { pushGuard(); histGuard = true; toast(T('frm.backhint')); return; }

document.addEventListener('change', function (e) {
  var el = e.target;

    var fr = new FileReader();

      try {

    };
    fr.readAsText(el.files[0]);
    return;
  }
  var vcard = el.closest && el.closest('.view-card');
  if (vcard) {
    var V = store.settings.views[+vcard.getAttribute('data-vi')];
    if (el.hasAttribute('data-vfield')) { var fv = el.value.trim(); if (el.getAttribute('data-vfield') === 'name' && !fv) { el.value = V.name; return; } V[el.getAttribute('data-vfield')] = fv; settingsChanged(); return; }
    if (el.hasAttribute('data-vflag')) { V[el.getAttribute('data-vflag')] = el.checked; settingsChanged(); return; }
    if (el.hasAttribute('data-vperson')) { V.cond.person = el.value.split(/[,،]/).map(function (x) { return x.trim(); }).filter(Boolean); settingsChanged(); return; }
  }
  // C: সবসময় খোলা তারিখ-বার — বদলালেই প্রয়োগ
  if (el.id === 'dbFrom' || el.id === 'dbTo') { setRange($('dbFrom').value, $('dbTo').value); return; }

  if (r) {
    var o = listOf(r.k)[r.i];
    if (el.hasAttribute('data-optname')) { if (renameOpt(r.k, r.i, el.value)) settingsChanged(T('opt.renamed')); else el.value = o.name; }
    if (el.hasAttribute('data-optlabel')) { var lv = el.value.trim(); o.label = lv === o.name ? '' : lv; settingsChanged(T('opt.labelset', o.name, stLabel(o.name))); return; }

    if (el.hasAttribute('data-optgroup')) { o.group = el.value; settingsChanged(T('opt.grpchanged', T('grp.' + el.value))); }
    if (el.hasAttribute('data-optactive')) { o.active = el.checked; settingsChanged(T(o.active ? 'opt.on' : 'opt.off', o.name)); }

    u[f] = v;
    settingsChanged(T('u.updated'));
    if (u.id === me().id && !can('settings')) setView('list');

  var G = store.settings.general;
  if (el.hasAttribute && el.hasAttribute('data-gfield')) {
